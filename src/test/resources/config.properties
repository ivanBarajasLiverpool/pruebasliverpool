# ==========================================
# 1. CONFIGURACIÓN GENERAL DE EJECUCIÓN
# ==========================================
# Plataforma por defecto: web | android
execution.platform=web
browser.name=chrome
browser.headless=false
browser.maximize=true

# ==========================================
# 2. URLs DE APLICACIÓN (WEB)
# ==========================================
url.liverpool=https://www.liverpool.com.mx/tienda/home
url.bananarepublic=https://bananarepublic.liverpool.com.mx/

# ==========================================
# 3. ESTRATEGIA DE SINCRONIZACIÓN (TIMEOUTS)
# ==========================================
timeout.implicit.seconds=0
timeout.explicit.seconds=15
timeout.pageload.seconds=30
timeout.polling.millis=500

# ==========================================
# 4. CONFIGURACIÓN MOBILE (APPIUM - ANDROID)
# ==========================================
appium.server.url=http://127.0.0.1:4723
appium.platform.name=Android
appium.automation.name=UiAutomator2
appium.device.name=emulator-5554
appium.app.package=mx.com.liverpool.shoppingapp
appium.app.activity=mx.com.liverpool.shoppingapp.SplashActivity
appium.app.wait.activity=*
appium.no.reset=true
appium.auto.grant.permissions=true
appium.new.command.timeout=60